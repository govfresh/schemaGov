name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install jsonschema referencing pyshacl rdflib PyLD certifi

      - name: Build site
        run: npm run build

      # Every URL below is pinned by documents other people have published.
      # A failure here means previously valid data would stop resolving.
      - name: Check namespace URLs resolve
        run: node tools/check-namespace.js

      # Proves a published document parses by FETCHING its @context over HTTP, the path
      # a real consumer takes - our other tools inline the local file and would not
      # notice a missing or stale published context.
      - name: Check published context is consumable
        run: python3 tools/check-context.py

      # Catches the class of fault invisible to both validation tiers: terms that expand
      # to nothing, collide, or resolve into a namespace where they are not defined.
      - name: Audit JSON-LD context
        run: python3 tools/audit-jsonld.py

      - name: Validate examples (shape, references, conformance)
        run: python3 tools/validate.py examples/example-gov

      # Tier two of SPEC section 4: checks what a reference resolves TO,
      # which JSON Schema structurally cannot see.
      - name: Validate examples (SHACL semantics)
        run: python3 tools/shacl.py examples/example-gov

      # Passing data proves nothing if a validator accepts everything. This runs a fixture
      # that is wrong on purpose and fails unless every fault is flagged.
      - name: Check validators reject invalid data
        run: python3 tools/check-invalid.py

      # Real publishers' data, converted by the adapters, validated by both tiers.
      - name: Validate pilots (shape, references, SHACL)
        run: npm run validate:pilot

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
